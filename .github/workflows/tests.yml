name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: '3.9'
            numpy: 'numpy==2.0.0'
          - python-version: '3.12'
            numpy: numpy
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PyLdB and test dependencies
        run: python -m pip install . pytest "${{ matrix.numpy }}"
      - name: Run tests
        run: pytest --import-mode=importlib verif/test.py
