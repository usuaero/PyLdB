name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.9'
            numpy: 'numpy==2.0.0'
            runner: ubuntu-22.04
          - python-version: '3.12'
            numpy: numpy
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PyLdB and test dependencies
        run: python -m pip install . pytest "${{ matrix.numpy }}"
      - name: Run tests
        run: pytest --import-mode=importlib -o pythonpath=verif verif/test.py verif/test_mark_vii.py
